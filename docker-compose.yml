services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST}:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres_test:
    image: pgvector/pgvector:pg16
    profiles: [test]
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-sidebrain_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-sidebrain_test}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-sidebrain_test}
    ports:
      - "${TEST_POSTGRES_HOST:-127.0.0.1}:${TEST_POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis_broker
    restart: always
    ports:
      - "${REDIS_HOST}:${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
