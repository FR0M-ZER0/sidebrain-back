[project]
name = "sidebrain_back"
version = "0.1.0"
description = "Mentor IA para aprendizagem de novas habilidades!"
readme = "README.md"
authors = [
    { name = "João Suzuki", email = "joaosuzuki98@outlook.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.12.0",
    "celery>=5.6.3",
    "docutils>=0.20.1",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "flower>=2.1.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "markdown-it-py>=3.0.0",
    "openai>=1.66.0",
    "pgvector>=0.5.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.11.0",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "tiktoken>=0.9.0",
]

[project.scripts]
dev = "main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 79

extend-exclude = [
    ".specify",
    "migrations/versions/*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"migrations/env.py" = ["F401"]